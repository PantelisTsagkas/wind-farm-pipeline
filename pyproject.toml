[project]
name = "wind-farm-pipeline"
version = "0.1.0"
description = "Clean hourly wind turbine readings, summarise daily power, and flag anomalous turbines."
readme = "README.md"
authors = [
    { name = "Pantelis Tsagkas", email = "102387490+PantelisTsagkas@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[project.scripts]
wind-farm = "wind_farm_pipeline.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
notebook = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
